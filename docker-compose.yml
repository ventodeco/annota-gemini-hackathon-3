version: '3'
services:
  db:
    image: postgres:13-alpine
    ports:
      - "5432:5432"
    volumes:
      - "pg-data:/var/lib/postgresql/data"
    environment:
      - POSTGRES_DB=gemini_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - "redis-data:/data"
    command: redis-server --appendonly yes

volumes:
  pg-data: {}
  redis-data: {}
