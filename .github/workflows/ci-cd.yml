name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: '1.4.3'

jobs:
  backend:
    name: Backend checks and final image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: annota_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_DSN: postgres://postgres:ci-only@localhost:5432/annota_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify PostgreSQL migrations without skipping
        working-directory: backend
        run: |
          set -o pipefail
          test -n "$POSTGRES_TEST_DSN"
          go test -count=1 -v ./internal/storage -run 'Postgres$' | tee "$RUNNER_TEMP/postgres-tests.log"
          if grep -q -- '--- SKIP' "$RUNNER_TEMP/postgres-tests.log"; then
            echo "A PostgreSQL test skipped" >&2
            exit 1
          fi

      - name: Test, vet, and build backend
        working-directory: backend
        run: |
          go test ./...
          go vet ./...
          go build ./cmd/server

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build final backend image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: false
          load: true
          tags: annota-be:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Smoke-test final backend image
        env:
          BACKEND_IMAGE: annota-be:ci
        run: bash scripts/ops/smoke-images.sh backend

  frontend:
    name: Frontend checks and final image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_API_BASE_URL: http://localhost:8080
      VITE_APP_URL: http://localhost:5173
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}

      - name: Install the locked root workspace
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Test, lint, and build frontend
        run: |
          bun run test
          bun run lint
          bun run build

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build final frontend image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: web/Dockerfile
          push: false
          load: true
          tags: annota-fe:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          build-args: |
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
            VITE_APP_URL=${{ env.VITE_APP_URL }}

      - name: Smoke-test final frontend image
        working-directory: .
        env:
          FRONTEND_IMAGE: annota-fe:ci
        run: bash scripts/ops/smoke-images.sh frontend
